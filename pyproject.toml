[project]
name = "stock_trader"
version = "0.0.1"
description = "AI-powered Stock Trader"
authors = [
    {name = "Sharhad", email = "sharhadbashar09@gmail.com"},
]
requires-python = ">3.12,<3.15"
dependencies = [
    "alembic>=1.18.5",
    "diskcache>=5.6.3",
    "fastapi>=0.139.0",
    "firebase-admin>=7.5.0",
    "logfire>=4.37.0",
    "openai-agents>=0.18.2",
    "pathvalidate>=3.3.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-ai>=2.9.0",
    "pydantic-ai-harness>=0.7.0",
    "sqlalchemy>=2.0.51",
    "sse-starlette>=3.3.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['.']
